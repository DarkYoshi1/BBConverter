name: Build Linux executable

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build with Nuitka
        run: bash build.sh

      - name: Verify build outputs
        run: |
          set -euo pipefail
          for file in build/BBConverter build/config/effect_overrides.json build/config/sheet_overrides.json build/config/chart.cfg; do
            if [[ ! -s "$file" ]]; then
              echo "[build] ERROR: Required build output is missing or empty: $file" >&2
              exit 1
            fi
          done
          if [[ ! -x build/BBConverter ]]; then
            echo "[build] ERROR: build/BBConverter is not executable" >&2
            exit 1
          fi

      - name: Upload executable and config
        uses: actions/upload-artifact@v4
        with:
          name: BBConverter-linux
          path: |
            build/BBConverter
            build/config/
          if-no-files-found: error
